<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-group">
        <legend class="form-group-title">Ваши личные данные</legend>
        <label for="name" class="label">Ваше имя</label>
        <input
          id="name"
          class="input"
          type="text"
          placeholder="Имя"
          name="name"
          required
        />
        <label for="age" class="label">Ваш возраст</label>
        <input
          id="age"
          class="input"
          type="number"
          placeholder="Возраст"
          name="name"
          required
          inputmode="numeric"
        />
        <label for="number" class="label">Ваш номер телефона</label>
        <input
          id="number"
          class="input"
          type="tel"
          placeholder="Номер телефона"
          name="number"
          required
          inputmode="tel"
        />
        <label for="email" class="label">Ваша почта</label>
        <input
          id="email"
          class="input"
          type="email"
          placeholder="Почта"
          name="email"
          required
          inputmode="email"
        />
      </fieldset>
      <fieldset class="form-group">
        <label for="message" class="label"> Сообщение</label>
        <textarea
          id="message"
          name="message"
          required
          class="textarea"
          placeholder="Ваше сообщение"
        ></textarea>
        <label class="label">
          <input type="checkbox" class="checkbox" name="checkbox" required="" />
          <span class="checkbox-text"> Я принимаю правила</span>
        </label>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
