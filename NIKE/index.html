<!DOCTYPE html>
<html class="page" lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/index.css">
  <link rel="shortcut icon" href="./icons/nike-logo.svg" type="image/x-svg">
  <script defer src="./js/index.js" type="module"></script>
  <title>NIKE</title>
</head>

<body class="page__body">
  <div class="container">
    <header class="header">
      <div class="container header__container">

        <a class="logo header__logo" href="#">
          <img src="./icons/лого.svg" width="50" height="20" alt="логотип найки">
        </a>

        <nav class="menu header__menu" id="header__menu" aria-label="главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#air-mag" lang="en">Air Mag</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#sizes">Размеры</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#characteristics">Характеристики</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#top models">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>

        <div class="header__controls">
          <a class="header__order" href="#">Сделать заказ</a>

          <div class="header__actions">
            <button class="header__actions-button" title="поиск" aria-label="поиск">
              <svg width="24" height="24">
                <use class="header__actions-icon" href="./icons/search-icon.svg#search">
                </use>
              </svg>
            </button>
            <button class="header__actions-button" title="корзина" aria-label="корзина">
              <svg width="24" height="24">
                <use class="header__actions-icon" href="./icons/search-icon.svg#cart">
                </use>
              </svg>
            </button>
            <button class="header__burger burger" title="Меню" aria-label="Открыть меню" aria-expanded="false"
              aria-controls="header__menu">
              <svg width="24" height="24">
                <use class="burger__icon-menu" href="./icons/search-icon.svg#menu-burger">
                </use>
                <use class="burger__icon-x" href="./icons/search-icon.svg#menu-x">
                </use>
              </svg>
            </button>
          </div>

        </div>

      </div>
    </header>
  </div>
</body>

</html>
